name: Guardar inscripciones

# Cada 15 minutos pasa las inscripciones nuevas (cifradas) del canal de envío
# a la rama datos-inscripciones, para que no se pierdan. El contenido solo se
# puede leer con la clave del panel.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inscripciones.yml']

permissions:
  contents: write

concurrency:
  group: inscripciones
  cancel-in-progress: false

env:
  CANAL: liboxcund-insc-42c38a2dd5d29d0d088e
  RAMA: datos-inscripciones

jobs:
  guardar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Abrir la rama de datos
        run: |
          git init -q datos && cd datos
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin "$RAMA"; then git checkout -q -b "$RAMA" FETCH_HEAD; else git checkout -q --orphan "$RAMA"; fi
          touch inscripciones.jsonl
      - name: Traer envíos nuevos
        run: curl -fsS --max-time 60 "https://ntfy.sh/$CANAL/json?poll=1&since=12h" -o nuevos.jsonl || echo -n > nuevos.jsonl
      - name: Guardar los que falten
        run: |
          python3 - <<'PY'
          import json
          TOPE = 5000
          ruta = 'datos/inscripciones.jsonl'
          guardados, ids = [], set()
          for linea in open(ruta, encoding='utf-8'):
              linea = linea.strip()
              if not linea: continue
              try: s = json.loads(linea)
              except ValueError: continue
              guardados.append(s); ids.add(s.get('id'))
          nuevos = 0
          for linea in open('nuevos.jsonl', encoding='utf-8'):
              try:
                  m = json.loads(linea)
                  if m.get('event') != 'message': continue
                  s = json.loads(m.get('message', ''))
              except ValueError: continue
              if not isinstance(s, dict) or s.get('v') != 1: continue
              if not all(isinstance(s.get(k), str) and 0 < len(s[k]) <= 1200 for k in ('id', 'k', 'iv', 'c')): continue
              if len(s['id']) > 40 or s['id'] in ids or len(guardados) >= TOPE: continue
              guardados.append({'v': 1, 'id': s['id'], 't': int(m.get('time', 0)), 'k': s['k'], 'iv': s['iv'], 'c': s['c']})
              ids.add(s['id']); nuevos += 1
          if nuevos:
              with open(ruta, 'w', encoding='utf-8') as f:
                  for s in guardados: f.write(json.dumps(s, separators=(',', ':')) + '\n')
          print('nuevos:', nuevos, 'total:', len(guardados))
          PY
          cd datos
          git add inscripciones.jsonl
          if ! git diff --cached --quiet || ! git rev-parse -q --verify HEAD >/dev/null; then
            git -c user.name="inscripciones-bot" -c user.email="actions@github.com" commit -q -m "Inscripciones guardadas"
            git push -q origin "$RAMA"
          fi
