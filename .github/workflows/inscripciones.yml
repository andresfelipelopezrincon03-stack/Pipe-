name: Guardar inscripciones

# Cada 10 minutos pasa las inscripciones nuevas y sus soportes de pago (todo
# cifrado) del canal de envío a la rama datos-inscripciones, para que no se
# pierdan. El contenido solo se puede leer con la clave del panel.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inscripciones.yml', 'herramientas/guardar_inscripciones.py']

permissions:
  contents: write

concurrency:
  group: inscripciones
  cancel-in-progress: false

env:
  CANAL: liboxcund-insc-42c38a2dd5d29d0d088e
  RAMA: datos-inscripciones

jobs:
  guardar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Abrir la rama de datos
        run: |
          git init -q datos && cd datos
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin "$RAMA"; then git checkout -q -b "$RAMA" FETCH_HEAD; else git checkout -q --orphan "$RAMA"; fi
      - name: Traer envíos nuevos
        run: curl -fsS --max-time 60 "https://ntfy.sh/$CANAL/json?poll=1&since=12h" -o nuevos.jsonl || echo -n > nuevos.jsonl
      - name: Guardar los que falten
        run: |
          python3 herramientas/guardar_inscripciones.py nuevos.jsonl datos
          cd datos
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="inscripciones-bot" -c user.email="actions@github.com" commit -q -m "Inscripciones guardadas"
            git push -q origin "$RAMA"
          fi
