name: Publicar en GitHub Pages

on:
  push:
    branches:
      - main
      - claude/multiplatform-wolf-logo-app-icv85j
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js assets icons _site/
          touch _site/.nojekyll
      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          commit_message: Publicación automática del sitio
